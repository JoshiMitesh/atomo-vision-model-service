# Slave Node runtime configuration.
# Model-specific settings live in config/models/*.yaml, NOT here.

# Device identity/registration record — flat, top-level, matching the
# shape of the auto-generated registration entry this stands in for
# until that flow exists (device_id/mac_id/serial_no/status/
# approval_status are normally auto-generated; entered manually here
# for now). Set uniquely per physical device before deploying.
device_id: 9a05d65f-ecf3-433b-ab60-0a3c3fab387f
device_name: neha-zbook
password: '1234'
device_role: slave
ip: 192.168.1.21
dns_name: neha-zbook.local
mac_id: '40:EC:99:B6:58:55'
serial_no: SN-99B65855
status: Active
approval_status: approved

nats:
  host: 192.168.1.21
  port: 4222
  use_websocket: false
  reconnect_wait_seconds: 2
  user: electron
  password: '190325'
  # Optional auth — leave both null for an unauthenticated NATS server
  # (matches current behavior). Set per-device before deploying.
  # Single source of truth for every subject this account uses —
  # config.py's load_slave_config() picks job/stop/detection/upload/
  # health/cmd/register subjects out of these two lists instead of
  # declaring them separately, so a subject actually has to be granted
  # here to be usable. Every "*" below is resolved to this file's own
  # top-level device_name (savan-patel-victus, above) at load time —
  # deliberately NOT spelled out literally here, so changing device_name
  # once at the top automatically carries through to every permission
  # without editing this list. job/stop/detection subjects are per-device
  # (<device_name>.jobs.assign/.unassign, devices.<device_name>.detections)
  # instead of the old flat slave.jobs.start/slave.jobs.stop/cam.detection.
  permissions:
    publish:
      - devices.*.register
      - devices.*.health
      - devices.*.detections
    subscribe:
      - _INBOX.>
      - "*.jobs.assign"
      - "*.jobs.unassign"
      - devices.*.cmd

# Device timing for the health/telemetry/command channel
# (processes/device/) — identity lives at the top of this file now.
device:
  heartbeat_interval_seconds: 5

jobs:
  path: config/jobs.yaml
  poll_interval_seconds: 5

minio:
  endpoint: 192.168.1.21:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: face
  secure: false
  enabled: true # TEMP: MinIO server at 192.168.1.21 has no license — set back to true once 'mc license update' is run on the server

# Storage-occupancy-based auto-cleanup for MinIO.
# Monitors the WHOLE SYSTEM DISK usage (psutil.disk_usage("/").percent — same
# metric reported in the device health payload). When disk usage exceeds
# threshold_percent, the oldest MinIO objects are deleted first (ascending
# last_modified order) in chunks of delete_window until usage drops below
# the threshold again.
storage_cleanup:
  enabled: true
  # Whole-system disk used-% that triggers a cleanup pass.
  # e.g. on a 256 GB SSD, 90 means "start deleting when 230 GB are used".
  threshold_percent: 89
  # How much data (oldest-first by upload time) to delete per cleanup pass.
  # Supported units: "hours" | "minutes"
  delete_window:
    amount: 10
    unit: minutes    # delete 1 hour's worth of oldest objects per pass; change to "minutes" for finer granularity
  # How often the agent checks disk occupancy (seconds). 300 = every 5 min.
  check_interval_seconds: 300

video:
  segment_seconds: 30
  temp_dir: storage/tmp/video
  fps: 10
  enabled: false  # stop uploading 30-sec video segments to MinIO specifically — frame uploads
                  # (minio.enabled above) are untouched; set true to resume video uploads

logging:
  dir: logging_output
  max_bytes: 10485760   # 10 MB
  backup_count: 5
  level: INFO
