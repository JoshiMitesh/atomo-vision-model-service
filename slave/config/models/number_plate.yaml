# Static model configuration for model_type: number_plate.
# jobs.yaml carries only *which* job/stream/model runs -- permanent
# model behaviour (classes, thresholds, resolution, OCR/tracking
# tuning) belongs here, same convention as person.yaml/fire.yaml.

model_type: number_plate

# Published in every Detection's "model_name" field sent to the Master
# (NATS cam.detection) -- see person.yaml's `display_name` comment for
# why this must be the Master's ENUM/display string, not a filename.
display_name: Number Plate

classes:
  - number_plate
num_classes: 1
listsize: 65          # num_classes + 64 DFL channels (confirmed from the compiled .nb's tensor dims)

thresholds:
  # Raised from an initial 0.35 -- live RTSP testing (alpr_rtsp.py) showed
  # false-positive plate detections at that level.
  obj_thresh: 0.55
  nms_thresh: 0.45

# Plate-box shape filter applied by the detector (pt and nb), ported
# from the reference alpr_rtsp.py's plate_bbox_valid() -- discards
# boxes too small to ever OCR successfully, or shaped nothing like a
# plate (rejects square-ish false positives: signs, faces, etc.),
# before they reach tracking/OCR at all.
filters:
  min_plate_width_px: 45
  min_plate_height_px: 15
  min_plate_aspect: 2.0        # width / height
  max_plate_aspect: 8.0
  min_plate_area_ratio: 0.00005   # plate box area / full-frame area -- rejects tiny noise detections

input:
  # 640 is confirmed twice: the .pt checkpoint's train_args (imgsz=640,
  # strides [8,16,32]) AND the compiled number_plate.nb itself -- its
  # tensor tables contain [80,80,65], [40,40,65], [20,20,65] (= 640 /
  # strides 8,16,32) and a 640 input; no other size matches all three
  # grids. A wrong-size buffer against a fixed-size NPU graph silently
  # overruns and segfaults (see person.yaml/fire.yaml), so if the model
  # is ever recompiled at another size change default_size here.
  default_size: 640
  large_size: 1024
  large_size_keyword: "1024"   # model_name containing this token uses large_size
  pad_value: 114

pt:
  filters:
    min_plate_width_px: 45
    min_plate_height_px: 15
    min_plate_aspect: 2.0
    max_plate_aspect: 8.0
    min_plate_area_ratio: 0.00005
  # Resolved flat against processes/worker/models/number_plate/ (same
  # convention as person.pt/fire.pt).
  model_file: number_plate.pt
  device: cuda:0          # auto | cpu | cuda:0
  half: true
  # Plate detector backend. open_image_models = anpr_night's proven
  # YOLOv9-t (ONNX, no torch; auto-downloads on first use; model_file
  # above is then unused). ultralytics = the number_plate.pt checkpoint.
  backend: ultralytics
  oim_model: yolo-v9-t-640-license-plate-end2end
  oim_conf_thresh: 0.25   # anpr_night's value
  shape_filter: false     # anpr_night applies no box shape filter

nb:
  # Amlogic A311D NPU runtime options (see runtimes/npu/nb_runtime.py).
  # level/device_id/board match this project's physically-confirmed
  # board (hostname `electron`, ASNN SDK) -- same values as fire.yaml /
  # person.yaml; re-verify if ever deployed to a different board.
  model_file: number_plate.nb
  library_file: number_plate.so   # .nb companion library, resolved against the same folder
  level: 0
  device_id: 0
  board: Electron
  # REVERTED to 3 (2026-10-16): tried matching .pt's decode_every_n_frames=1
  # ("decode every frame") to give .nb as many chances to catch a
  # passing plate as .pt gets, but on this board that overloaded the
  # single-threaded (threads=1) H.264 decoder -- live-tested with 2
  # concurrent number_plate.nb jobs, it produced continuous "reference
  # picture missing during reorder" FFmpeg warnings (320+ in under a
  # minute, vs. zero at decode_every_n_frames=3), meaning frames fed to
  # the NPU were corrupted/dropped more often, not less -- a net
  # regression. 3 is the empirically-clean value for THIS board's RTSP
  # decode; the actual fix for .nb's low publish rate was the shared
  # `ocr:` block's min_confirmations below, which carries no decode-CPU
  # cost at all.
  decode_every_n_frames: 3

  # NB/SO-path-only detection tuning (npu_decoder.py -- the .so path
  # shares this block). Values are the board-verified alpr_npu.py's:
  # cells need sigmoid(class) >= candidate_gather_thresh, then a
  # DFL-certainty >= dfl_certainty_thresh; NMS then keeps boxes with
  # score >= obj_thresh at IoU nms_thresh. The plate-shape filter is the
  # shared `filters:` block above (pixels of the frame the worker gets).
  #
  # Confirmed by that script (not assumed): input 640, outputs
  # 80x80/40x40/20x20 with 65 channels per cell, class logit FIRST
  # (channel 0) then 4x16 DFL, RGB input plus reorder '2 1 0'.
  # Cap on NPU inferences per second per job (alpr_npu.py's NPU_FPS = 12);
  # 0 disables the cap.
  target_fps: 12
  # History: originally 0.45 -- lowered to 0.25 (2026-10-16) to match
  # .pt's oim_conf_thresh and stop rejecting real plates outright.
  # Briefly raised to 0.35, then reverted back to 0.25 (2026-10-19): a
  # fuller accuracy audit found wrong reads at detection confidence
  # from 0.33 up to 0.80 -- box confidence does not actually predict
  # whether the OCR text is right, so raising this threshold only lost
  # real detections without reliably filtering bad ones. Quality
  # filtering now happens on a more direct signal instead -- the OCR
  # model's own confidence, see ocr.min_score below -- so this stays
  # lenient for coverage.
  obj_thresh: 0.25
  nms_thresh: 0.30
  candidate_gather_thresh: 0.18
  dfl_certainty_thresh: 0.18

so:
  # Native .so inference library options (see runtimes/npu/so_runtime.py).
  # Same "ABI not wired up yet" gap as every other model's .so path
  # today (SoRuntime._init()/infer() raise NotImplementedError). The
  # decode settings are read from the nb: block above.
  device_id: 0

# OCR (plate text read) settings -- shared by every extension (.pt,
# .nb, .so). anpr_night's night-CCTV pipeline (plate_ocr.py/
# plate_enhance.py): each plate box is read 2 pad ratios x 2 crop
# variants (raw grayscale + black-hat cleaned) with fast-plate-ocr,
# then voted. Each vehicle is published once, only after its number is
# read (unread boxes are never published).
#
# Used to be .pt-only, with .nb/.so each keeping an independent
# "npu_ocr:" block -- an independent OCR module (npu_plate_ocr.py),
# tracker (npu_plate_tracker.py) and confirmation threshold, tuned
# separately from this one. That split was the direct cause of two
# live-tested bugs: npu_plate_ocr.py's perspective-correction fallback
# silently truncated the last character of every read of a plate (this
# plate_ocr.py never warped the crop at all and never had the bug),
# and npu_ocr's min_valid_observations had quietly drifted to 3 against
# this block's min_confirmations of 2 -- a stricter bar nobody had
# actually decided on, just never kept in sync. All three extensions
# now read this one block, so that kind of drift can't happen again.
ocr:
  enabled: true
  model_name: cct-s-v2-global-model   # confirmed working in anpr_night/anpr.py
  interval_frames: 1          # OCR every processed frame, like anpr_night
  search_interval_frames: 1   # OCR rate while a track has no accepted read yet
  # Raised from 0.0 (2026-10-19): an accuracy audit of confirmed
  # uploads found wrong reads at DETECTION confidence from 0.33 up to
  # 0.80 -- box confidence (obj_thresh) does not predict whether the
  # OCR text is right, so threshold tuning on it hit a ceiling. This
  # gates on a different, more direct signal instead: the OCR model's
  # own confidence in the TEXT it read. Untested starting point -- 0.5
  # rejects a read before it ever enters tracking/voting if the OCR
  # itself wasn't confident, rather than trying to approximate that
  # through the detector's box confidence.
  min_score: 0.5
  pad_ratios: [0.10, 0.20]    # small pad variance fixes clipped first/last chars
  max_vote_history: 30
  # A plate is published once it has this many reads of the exact same
  # string. Lowered to 1 (2026-10-19, explicit user call): with 2, a
  # plate seen only once before the vehicle leaves frame -- common on
  # sparse-traffic cameras like job_051's -- never gets published at
  # all, even though a real box and a real OCR read existed. 1 means
  # every detected, read plate is published; the tradeoff is an
  # occasional wrong single-read text (e.g. the "GJ3ZT805" misread
  # found during tuning) can now get published uncorrected, since
  # there's no second read left to catch it against.
  min_confirmations: 2
  validate_indian_plate: true

# Cross-frame plate tracking (nearest-center greedy match, with
# velocity prediction so a track survives real-world gaps between
# sparse detections) so OCR accumulates votes for the same physical
# plate instead of restarting every frame -- ported from the
# reference's PlateTrack/update_tracks. Shared by every extension, see
# `ocr:` above for why.
tracking:
  max_match_distance_px: 90
  max_missed_frames: 15   # fallback only when capture timestamps are unavailable
  max_track_gap_seconds: 1.5  # brief detector gap; longer disappearance starts a new event
