# Static model configuration for model_type: person.
# jobs.yaml carries only *which* job/stream/model runs — permanent
# model behaviour (classes, thresholds, resolution) belongs here.

model_type: person

# Published in every Detection's "model_name" field sent to the Master
# (NATS cam.detection) — deliberately NOT the job's model filename
# (e.g. "person_yolo26n.pt", "person.nb"). The Master's Redis alert-rule
# engine does an exact-string Redis key match (alert_rule:<camera>:<model>:*)
# against the model name the rule was authored with in the backend, which
# is the ENUM value "Person" — not a filename. Sending the filename here
# means the Redis key lookup never matches and alerts silently never fire,
# even though detections still land in Postgres (that insert path fuzzy-
# matches model names, Redis does not). Keep this in sync with whatever
# the Master's model ENUM/dashboard actually calls this model.
display_name: Person

classes:
  - person
num_classes: 1
listsize: 65          # num_classes + 64 DFL channels

thresholds:
  obj_thresh: 0.28
  nms_thresh: 0.25

input:
  # default_size was 640 but the actual person.nb on the A311D board is
  # compiled fixed at 1024x1024 (confirmed: its output grids are
  # 128x128/64x64/32x32 — matches strides 8/16/32 @ 1024, not @ 640 —
  # regardless of what size buffer it's fed, since the NPU graph's input
  # resolution is baked in at compile time and the driver doesn't
  # validate it, so a 640x640 buffer silently overruns and segfaults).
  # The `large_size_keyword` filename heuristic below doesn't catch this
  # because the file is just named person.nb. If a genuinely
  # 640-native .nb model is ever added, give IT a "1024"-free name and
  # this model a name containing "1024" instead of relying on this
  # default.
  default_size: 1024
  large_size: 1024
  large_size_keyword: "1024"   # model_name containing this token uses large_size
  pad_value: 114

pt:
  device: auto         # auto | cpu | cuda:0
  half: false

nb:
  # Amlogic A311D NPU runtime options (see runtimes/npu/nb_runtime.py).
  # These are NOT blindly copied from the reference — confirmed against
  # the actual SDK installed on this board (hostname `electron`): ASNN,
  # not KSNN (KSNN targets Khadas VIM3 and isn't installed here). `board`
  # is the identifier ASNN's constructor expects (asnn.api.asnn(board)) —
  # "Electron" matches this board's own reference scripts (~/p2.py).
  # Re-verify both if this config is ever deployed to a different board.
  level: 0
  device_id: 0
  board: Electron
  # Filename only, resolved against processes/worker/models/person/
  # (same directory as the .nb model file itself).
  library_file: person.so
  low_cpu_mode: true        # matches the reference script: inference-only hot path, no MinIO upload or video recording per frame.
  publish_every_n_frames: 8  # sample every 8th processed frame to keep CPU and NATS load under control.
  process_interval: 0.0      # reference-style shared NPU scheduler: no extra pause beyond the round-robin cadence itself.
  target_fps: 2              # board-safe baseline matching the known-good reference behavior for multiple cameras.

  # NB-path-only detection tuning (person_nb_detector.py). Overrides
  # the shared thresholds: block above for this path only — .pt/.so
  # are untouched. Ported from the updated reference pipeline: a
  # two-stage confidence gate (gather -> DFL-certainty), a person
  # aspect-ratio geometry filter, a small-box area filter, and a
  # head-texture false-positive filter, then OpenCV NMS.
  obj_thresh: 0.16             # final universal sensitivity for office + crowded scenes
  nms_thresh: 0.26             # still keeps adjacent boxes separated without excessive merging
  candidate_gather_thresh: 0.10   # wider candidate gathering for weak but genuine people
  dfl_certainty_thresh: 0.10      # loosens certainty filtering for small/partially occluded people
  min_aspect_ratio: 0.55           # tolerant for seated/tilted/partially visible person shapes
  min_small_box_area: 900.0       # px^2 — catches smaller people in dense rooms
  small_box_score_thresh: 0.28     # lets small boxes through more readily when they are likely people
  high_conf_bypass: 0.45           # lower bypass threshold for confident detections
  head_texture_std_thresh: 9.0     # mild head-texture filter to keep false positives low
  head_texture_score_thresh: 0.38  # softer crowd-scene filtering
  MIN_BOX_HEIGHT_PX: 14            

so:
  # Native .so inference library options (see runtimes/npu/so_runtime.py).
  device_id: 0
