model_type: face
classes:
  - face
num_classes: 1
listsize: 5
thresholds:
  obj_thresh: 0.60
  nms_thresh: 0.50
input:
  default_size: 960
  default_height: 540
  large_size: 1024
  large_size_keyword: "1024"
  pad_value: 114
embedding:
  enabled: true
  model_name: face_recognition
  min_face_px: 50
  min_det_conf: 0.60
  max_faces_per_frame: 10
  l2_normalize: false
  decimals: 6
  landmark_score_thresh: 0.90
  landmark_nms_thresh: 0.30
  landmark_top_k: 5000
yunet:
  score_thresh: 0.90
  nms_thresh: 0.30
  top_k: 5000
trigger:
  enabled: false
  off_timeout_sec: 10
  inference_frame_interval: 2
pt:
  model_file: face.pt
  device: auto
  half: false
nb:
  model_file: face.nb
  library_file: face.so
  level: 0
  device_id: 0
  board: Electron
so:
  library_file: face.so
  device_id: 0
